name: PR Policy Approval (reusable engine)

# Shared engine for the single-contributor auto-approve bot.
# See single-contributor-bot-registry.yml for which repos may call this,
# and each adopting repo's .github/PULL_REQUEST_POLICY.md for its own
# allow-list. Do not add repo-specific logic here; repo differences belong
# in the calling workflow's `with:` inputs only.

on:
  workflow_call:
    inputs:
      allow-paths:
        description: >-
          Newline-separated shell glob patterns. If set, every changed file
          must match at least one pattern for the pull request to be
          eligible for approval. If omitted, any file not caught by the
          denylist is eligible (broad-allow mode).
        required: false
        type: string
        default: ""
      extra-denylist:
        description: >-
          Newline-separated shell glob patterns to add to the universal
          denylist below. Cannot remove or override the universal denylist.
        required: false
        type: string
        default: ""
      ci-check-name:
        description: Name of the required CI check that must be green.
        required: true
        type: string
      registry-repo:
        description: Repo that holds the adoption registry.
        required: false
        type: string
        default: synthesized-io/.github
      registry-path:
        description: Path to the registry file within registry-repo.
        required: false
        type: string
        default: single-contributor-bot-registry.yml

permissions:
  pull-requests: write
  checks: read

concurrency:
  group: pr-policy-approval-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Check the adoption registry for this repository
        id: registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY#*/}"
          content=$(gh api "repos/${{ inputs.registry-repo }}/contents/${{ inputs.registry-path }}" --jq '.content' | base64 -d)
          if echo "$content" | grep -qE "^[[:space:]]*-[[:space:]]*name:[[:space:]]*${repo_name}[[:space:]]*$"; then
            echo "on_registry=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_registry=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${repo_name} is not on the single-contributor bot registry. No approval will be attempted."
          fi

      - name: Exclude bot-authored pull requests
        id: author
        if: steps.registry.outputs.on_registry == 'true'
        run: |
          author="${{ github.event.pull_request.user.login }}"
          if [[ "$author" == *"[bot]" ]]; then
            echo "is_bot=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Pull request author ${author} is a bot identity. No approval will be attempted."
          else
            echo "is_bot=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the universal and repo-specific denylist
        id: denylist
        if: steps.registry.outputs.on_registry == 'true' && steps.author.outputs.is_bot == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Universal denylist. Not overridable by any repo input. A pull
          # request that touches any of these paths is never eligible for
          # automated approval, regardless of allow-paths.
          universal_denylist=(
            ".github/workflows/*"
            "Dockerfile"
            "deploy/*"
            "pyproject.toml"
            "package.json"
            "package-lock.json"
            "requirements.txt"
            "go.mod"
            "go.sum"
            "Gemfile"
            "Gemfile.lock"
          )

          extra_denylist=()
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            extra_denylist+=("$line")
          done <<< "${{ inputs.extra-denylist }}"

          all_denylist=("${universal_denylist[@]}" "${extra_denylist[@]}")

          changed_files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')

          blocked=false
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            for pattern in "${all_denylist[@]}"; do
              if [[ "$f" == $pattern ]]; then
                echo "::notice::Changed file '$f' matches denylist pattern '$pattern'. No approval will be attempted."
                blocked=true
              fi
            done
          done <<< "$changed_files"

          echo "blocked=$blocked" >> "$GITHUB_OUTPUT"
          {
            echo "changed_files<<PR_POLICY_EOF"
            echo "$changed_files"
            echo "PR_POLICY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check the repo-specific allow-list
        id: allowlist
        if: steps.registry.outputs.on_registry == 'true' && steps.author.outputs.is_bot == 'false' && steps.denylist.outputs.blocked == 'false'
        run: |
          set -euo pipefail
          allow_paths=()
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            allow_paths+=("$line")
          done <<< "${{ inputs.allow-paths }}"

          if [[ ${#allow_paths[@]} -eq 0 ]]; then
            # Broad-allow mode: the denylist step already ran, so anything
            # reaching this point already cleared it.
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          allowed=true
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            match=false
            for pattern in "${allow_paths[@]}"; do
              if [[ "$f" == $pattern ]]; then
                match=true
              fi
            done
            if [[ "$match" == "false" ]]; then
              echo "::notice::Changed file '$f' is not on this repository's allow-list. No approval will be attempted."
              allowed=false
            fi
          done <<< "${{ steps.denylist.outputs.changed_files }}"

          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

      - name: Check the required CI status
        id: ci
        if: steps.registry.outputs.on_registry == 'true' && steps.author.outputs.is_bot == 'false' && steps.denylist.outputs.blocked == 'false' && steps.allowlist.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}/check-runs" \
            --jq --arg name "${{ inputs.ci-check-name }}" '[.check_runs[] | select(.name == $name)] | last | .conclusion // "none"')
          if [[ "$conclusion" == "success" ]]; then
            echo "ci_green=true" >> "$GITHUB_OUTPUT"
          else
            echo "ci_green=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Required check '${{ inputs.ci-check-name }}' is not passing (conclusion: ${conclusion}). No approval will be attempted."
          fi

      - name: Submit the automated approval
        if: steps.registry.outputs.on_registry == 'true' && steps.author.outputs.is_bot == 'false' && steps.denylist.outputs.blocked == 'false' && steps.allowlist.outputs.allowed == 'true' && steps.ci.outputs.ci_green == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="This is an automated policy-based approval. It is not a human review.

          This repository has one maintainer with write access. A second human reviewer is not available for every change.

          A shared, org-approved bot checked this pull request against a written policy. All of the following are true:
          - The pull request does not change a GitHub Actions workflow file, the Dockerfile, the deploy folder, or a dependency manifest file.
          - The pull request only changes paths this repository allows for automated approval, where this repository defines an allow-list.
          - The required CI check, \"${{ inputs.ci-check-name }}\", passes.

          See .github/PULL_REQUEST_POLICY.md for the full policy. Any change that does not meet these conditions needs a manual justification recorded in Vanta."

          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" \
            -f event=APPROVE \
            -f body="$body"
